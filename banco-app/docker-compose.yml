version: '3.8'

services:
  db:
    image: postgres:13
    env_file: .env
    ports:
      - "5432:5432"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - banco-network

  transaction-service:
    build: ./api-transacoes
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - banco-network

  query-service:
    build: ./servico-query
    ports:
      - "5000:5000"
    restart: always
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - banco-network

networks:
  banco-network:
    driver: bridge